name: 'Question'
description: 'Ask about usage, setup, or behavior clarification.'
title: '[Question] '
labels: ['question']
type: Question
body:
  - type: markdown
    attributes:
      value: |
        Have a question about using **Shuflo**?
        Please check [Discussions](https://github.com/rotyro-tools/shuflo/discussions) first —
        if it's not answered there, ask below.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know?
      placeholder: |
        How do I use Shuflo with my own Spotify developer app?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you tried so far, and what's unclear?
      placeholder: |
        I set a Client ID in Settings but the login page shows an error.
    validations:
      required: false
