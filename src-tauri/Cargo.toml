[package]
name = "shuflo"
version = "0.1.0"
description = "Truly random in-place shuffle for Spotify playlists"
authors = ["rotyro"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name collision with the bin crate on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "shuflo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
tokio = { version = "1", features = ["full"] }
rand = "0.10.3"
sha2 = "0.11.0"
base64 = "0.23.1"
keyring = "4.2.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
